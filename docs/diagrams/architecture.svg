<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 908" width="1600" height="908" role="img" aria-label="How a message becomes a grounded, confirmed answer"><title>How a message becomes a grounded, confirmed answer</title><defs><marker id="dk-a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="context-stroke"/></marker></defs><rect width="1600" height="908" rx="28" fill="#e9e9e7" data-id="canvas"/><text x="64.0" y="84.0" font-family="Cascadia Mono, SFMono-Regular, Consolas, ui-monospace, monospace" font-size="15" font-weight="600" fill="#fe6608" text-anchor="start" letter-spacing="2" data-box="canvas">FDE PORTFOLIO · 01</text><text x="64.0" y="128.0" font-family="Segoe UI, Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="34" font-weight="700" fill="#141414" text-anchor="start" letter-spacing="0.0" data-box="canvas">How a message becomes a grounded, confirmed answer</text><rect x="64.0" y="341.0" width="277.4" height="232.0" rx="16" fill="#ffffff" stroke="#d2d0cb" stroke-width="1.5" data-id="customer"/><text x="86.0" y="377.0" font-family="Cascadia Mono, SFMono-Regular, Consolas, ui-monospace, monospace" font-size="13" font-weight="600" fill="#fe6608" text-anchor="start" letter-spacing="1.5" data-box="customer">CHANNELS</text><text x="86.0" y="415.0" font-family="Segoe UI, Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="22" font-weight="650" fill="#141414" text-anchor="start" letter-spacing="0.0" data-box="customer">Customer</text><text x="86.0" y="449.0" font-family="Segoe UI, Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#55534f" text-anchor="start" letter-spacing="0.0" data-box="customer">Local chat page, Slack bot,</text><text x="86.0" y="473.0" font-family="Segoe UI, Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#55534f" text-anchor="start" letter-spacing="0.0" data-box="customer">REST /chat</text><text x="86.0" y="497.0" font-family="Segoe UI, Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#55534f" text-anchor="start" letter-spacing="0.0" data-box="customer">Hinglish, typos and pushback</text><text x="86.0" y="521.0" font-family="Segoe UI, Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#55534f" text-anchor="start" letter-spacing="0.0" data-box="customer">welcome</text><rect x="397.4" y="341.0" width="277.4" height="232.0" rx="16" fill="#ffffff" stroke="#d2d0cb" stroke-width="1.5" data-id="guard_in"/><text x="419.4" y="377.0" font-family="Cascadia Mono, SFMono-Regular, Consolas, ui-monospace, monospace" font-size="13" font-weight="600" fill="#fe6608" text-anchor="start" letter-spacing="1.5" data-box="guard_in">GUARDRAILS</text><text x="419.4" y="415.0" font-family="Segoe UI, Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="22" font-weight="650" fill="#141414" text-anchor="start" letter-spacing="0.0" data-box="guard_in">Guard in</text><text x="419.4" y="449.0" font-family="Segoe UI, Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#55534f" text-anchor="start" letter-spacing="0.0" data-box="guard_in">PII masked in tool output and</text><text x="419.4" y="473.0" font-family="Segoe UI, Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#55534f" text-anchor="start" letter-spacing="0.0" data-box="guard_in">logs</text><text x="419.4" y="497.0" font-family="Segoe UI, Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#55534f" text-anchor="start" letter-spacing="0.0" data-box="guard_in">Injection lines stripped from</text><text x="419.4" y="521.0" font-family="Segoe UI, Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#55534f" text-anchor="start" letter-spacing="0.0" data-box="guard_in">retrieved text</text><text x="419.4" y="545.0" font-family="Segoe UI, Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#55534f" text-anchor="start" letter-spacing="0.0" data-box="guard_in">Authority claims declined</text><rect x="730.9" y="220.0" width="471.7" height="474.0" rx="16" fill="#fe6608" stroke="none" stroke-width="1.5" data-id="core"/><text x="752.9" y="256.0" font-family="Cascadia Mono, SFMono-Regular, Consolas, ui-monospace, monospace" font-size="13" font-weight="600" fill="#141414" text-anchor="start" letter-spacing="1.5" data-box="core">AGENT LOOP</text><text x="752.9" y="298.0" font-family="Segoe UI, Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#141414" text-anchor="start" letter-spacing="0.0" data-box="core">fusion27b:iq3 via Ollama</text><text x="752.9" y="326.0" font-family="Segoe UI, Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#141414" text-anchor="start" letter-spacing="0.0" data-box="core">Local, one RTX 5080, INR 0 per query</text><rect x="752.9" y="346.0" width="427.7" height="154.0" rx="16" fill="#ffffff" stroke="none" stroke-width="1.5" data-id="retrieve"/><text x="774.9" y="390.0" font-family="Segoe UI, Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="22" font-weight="650" fill="#141414" text-anchor="start" letter-spacing="0.0" data-box="retrieve">Retrieve</text><text x="774.9" y="424.0" font-family="Segoe UI, Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#55534f" text-anchor="start" letter-spacing="0.0" data-box="retrieve">Postgres full-text + pgvector, reciprocal rank fusion</text><text x="774.9" y="448.0" font-family="Segoe UI, Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#55534f" text-anchor="start" letter-spacing="0.0" data-box="retrieve">Expanded to whole top-3 articles</text><text x="774.9" y="472.0" font-family="Segoe UI, Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#55534f" text-anchor="start" letter-spacing="0.0" data-box="retrieve">Every policy claim cited [KB-xxx]</text><rect x="752.9" y="518.0" width="427.7" height="154.0" rx="16" fill="#141414" stroke="none" stroke-width="1.5" data-id="act"/><text x="774.9" y="562.0" font-family="Segoe UI, Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="22" font-weight="650" fill="#e9e9e7" text-anchor="start" letter-spacing="0.0" data-box="act">Act</text><text x="774.9" y="596.0" font-family="Segoe UI, Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#c9c7c2" text-anchor="start" letter-spacing="0.0" data-box="act">lookup_order with date facts computed in code</text><text x="774.9" y="620.0" font-family="Segoe UI, Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#c9c7c2" text-anchor="start" letter-spacing="0.0" data-box="act">check_stock, search_products</text><text x="774.9" y="644.0" font-family="Segoe UI, Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#c9c7c2" text-anchor="start" letter-spacing="0.0" data-box="act">start_return, create_ticket wait for Confirm or Cancel</text><rect x="1258.6" y="196.0" width="277.4" height="256.0" rx="16" fill="#ffffff" stroke="#d2d0cb" stroke-width="1.5" data-id="guard_out"/><text x="1280.6" y="232.0" font-family="Cascadia Mono, SFMono-Regular, Consolas, ui-monospace, monospace" font-size="13" font-weight="600" fill="#fe6608" text-anchor="start" letter-spacing="1.5" data-box="guard_out">CHECKS</text><text x="1280.6" y="270.0" font-family="Segoe UI, Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="22" font-weight="650" fill="#141414" text-anchor="start" letter-spacing="0.0" data-box="guard_out">Guard out</text><text x="1280.6" y="304.0" font-family="Segoe UI, Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#55534f" text-anchor="start" letter-spacing="0.0" data-box="guard_out">Citations to unretrieved articles</text><text x="1280.6" y="328.0" font-family="Segoe UI, Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#55534f" text-anchor="start" letter-spacing="0.0" data-box="guard_out">removed</text><text x="1280.6" y="352.0" font-family="Segoe UI, Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#55534f" text-anchor="start" letter-spacing="0.0" data-box="guard_out">A claimed action without a tool</text><text x="1280.6" y="376.0" font-family="Segoe UI, Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#55534f" text-anchor="start" letter-spacing="0.0" data-box="guard_out">call is retried</text><text x="1280.6" y="400.0" font-family="Segoe UI, Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#55534f" text-anchor="start" letter-spacing="0.0" data-box="guard_out">Unknown codes and ticket ids</text><text x="1280.6" y="424.0" font-family="Segoe UI, Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#55534f" text-anchor="start" letter-spacing="0.0" data-box="guard_out">blocked</text><rect x="1258.6" y="486.0" width="277.4" height="232.0" rx="16" fill="#ffffff" stroke="#d2d0cb" stroke-width="1.5" data-id="reply"/><text x="1280.6" y="522.0" font-family="Cascadia Mono, SFMono-Regular, Consolas, ui-monospace, monospace" font-size="13" font-weight="600" fill="#fe6608" text-anchor="start" letter-spacing="1.5" data-box="reply">OUTPUT</text><text x="1280.6" y="560.0" font-family="Segoe UI, Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="22" font-weight="650" fill="#141414" text-anchor="start" letter-spacing="0.0" data-box="reply">Reply and card</text><text x="1280.6" y="594.0" font-family="Segoe UI, Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#55534f" text-anchor="start" letter-spacing="0.0" data-box="reply">Answer with citations</text><text x="1280.6" y="618.0" font-family="Segoe UI, Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#55534f" text-anchor="start" letter-spacing="0.0" data-box="reply">Confirmation card for writes;</text><text x="1280.6" y="642.0" font-family="Segoe UI, Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#55534f" text-anchor="start" letter-spacing="0.0" data-box="reply">hedged yes never confirms</text><text x="1280.6" y="666.0" font-family="Segoe UI, Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#55534f" text-anchor="start" letter-spacing="0.0" data-box="reply">Hand-off to a person when</text><text x="1280.6" y="690.0" font-family="Segoe UI, Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#55534f" text-anchor="start" letter-spacing="0.0" data-box="reply">unsure</text><rect x="64.0" y="768.0" width="1472.0" height="76.0" rx="16" fill="#dcdad5" stroke="none" stroke-width="1.5" data-id="band"/><text x="88.0" y="814.0" font-family="Segoe UI, Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="20" font-weight="650" fill="#141414" text-anchor="start" letter-spacing="0.0" data-box="band">Postgres 17 + pgvector</text><text x="348.4" y="814.0" font-family="Segoe UI, Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#55534f" text-anchor="start" letter-spacing="0.0" data-box="band">40 help articles · 50 products · 200 orders · 30 tickets · request log</text><text x="1512.0" y="814.0" font-family="Segoe UI, Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#141414" text-anchor="end" letter-spacing="0.0" data-box="band">60-case eval: 53/60</text><path d="M345.4 457.0 L391.4 457.0" fill="none" stroke="#141414" stroke-width="2.5" marker-end="url(#dk-a)" stroke-linejoin="round" stroke-linecap="round"/><path d="M678.9 457.0 L724.9 457.0" fill="none" stroke="#141414" stroke-width="2.5" marker-end="url(#dk-a)" stroke-linejoin="round" stroke-linecap="round"/><path d="M1206.6 336.0 L1252.6 336.0" fill="none" stroke="#141414" stroke-width="2.5" marker-end="url(#dk-a)" stroke-linejoin="round" stroke-linecap="round"/><path d="M1397.3 456.0 L1397.3 480.0" fill="none" stroke="#141414" stroke-width="2.5" marker-end="url(#dk-a)" stroke-linejoin="round" stroke-linecap="round"/><path d="M966.7 698.0 L966.7 762.0" fill="none" stroke="#141414" stroke-width="2.5" stroke-dasharray="7 7" marker-end="url(#dk-a)" stroke-linejoin="round" stroke-linecap="round"/></svg>